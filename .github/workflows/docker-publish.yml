name: docker publish

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # Build the frontend on the runner (Node 20) instead of inside Docker.
      # Avoids the npm "Exit handler never called!" crash in Alpine builds
      # (npm/cli#8974): node:22/24-alpine fails, Node 20 works.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: true
          tags: |
            ghcr.io/zxlumen/photo-web:latest
            ghcr.io/zxlumen/photo-web:${{ github.sha }}
